<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>DeadlineOS demo resource</title>
  <link rel="stylesheet" href="/demo/sample-form.css">
  <script src="/demo/sample-form.js" defer></script>
</head>
<body>
  <main>
    <nav aria-label="Demo navigation"><a class="brand" href="/">DeadlineOS<span aria-hidden="true">.</span></a><a id="back" href="/">Return to workspace</a></nav>
    <header><h1 id="title">Demo resource</h1><p id="description">Loading the sample resource…</p></header>
    <p class="demo-notice">Presentation practice · Use fictional information. Entries stay on this page and are never submitted or saved.</p>
    <p id="availability" role="status" hidden></p>
    <section id="brief" aria-label="Resource brief" hidden></section>
    <form id="demo-form" autocomplete="off" hidden>
      <p class="field-help">All fields are required unless marked optional.</p>
      <fieldset id="fields"><legend class="sr-only">Sample form details</legend></fieldset>
      <label class="acknowledgement"><input id="acknowledgement" type="checkbox" required><span>I understand this is a demonstration.</span></label>
      <p id="next-step" class="field-help"></p>
      <button id="submit" type="submit">Simulate submission</button>
    </form>
    <section id="result" role="status" tabindex="-1" hidden></section>
    <noscript><p>Enable JavaScript to open this practice resource. No information is collected.</p></noscript>
  </main>
</body>
</html>
