<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DeadlineOS demo form</title><style>
@font-face{font-family:Plex;src:url('/fonts/ibm-plex-sans-latin-variable.woff2')}@font-face{font-family:Fraunces;src:url('/fonts/fraunces-latin-variable.woff2')}
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:40px 20px;background:#111318;color:#edf0f5;font:16px/1.6 Plex,Arial,sans-serif}main{max-width:640px;margin:auto}a{color:#f0b76b}h1{font:650 38px/1.15 Plex,Arial,sans-serif;letter-spacing:-.03em}label{display:block;margin:20px 0 7px}input[type=text],select{width:100%;min-height:48px;padding:10px 12px;border:1px solid #727e90;border-radius:3px;background:#1b1f27;color:inherit;font:inherit}button{min-height:48px;padding:10px 20px;background:#f0b76b;color:#1a1510;border:0;border-radius:3px;font:inherit;cursor:pointer}:focus-visible{outline:2px solid #f0b76b;outline-offset:3px}#result{border-top:1px solid #727e90;padding-top:20px;margin-top:24px}small{display:block;color:#a2aab8;margin-bottom:24px}
</style></head><body><main><a href="/">DeadlineOS</a><h1 id="title">Demo form</h1><p>This practice page represents an external form used in the presentation. It does not send or store a submission. Use fictional information.</p><form id="demo-form"><label for="name">Fictional name</label><input id="name" type="text" placeholder="e.g. Demo Student" required autocomplete="off"><label for="choice">Sample preference</label><select id="choice"><option>Consulting</option><option>Finance</option><option>Operations</option></select><label><input type="checkbox" required> I understand this is a demonstration.</label><small>After simulating submission, return to DeadlineOS and mark the appropriate completion or confirmation.</small><button>Simulate submission</button></form><p id="result" role="status" hidden></p></main><script>
const title=new URLSearchParams(location.search).get('title');if(title)document.getElementById('title').textContent=title;document.getElementById('demo-form').addEventListener('submit',function(e){e.preventDefault();const result=document.getElementById('result');result.hidden=false;result.textContent='Demo submission simulated. No information was sent or saved. Return to DeadlineOS to record your confirmation.';result.scrollIntoView({block:'nearest'});});
</script></body></html>
