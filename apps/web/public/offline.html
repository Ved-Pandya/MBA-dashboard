<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#9d3829" />
    <title>DeadlineOS - Offline</title>
    <style>
      :root { color-scheme: light; font-family: "IBM Plex Sans", sans-serif; color: #302a25; background: #f5f0e5; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { max-width: 420px; border: 1px solid #d7cdbc; border-radius: 0; padding: 34px; background: #fbf8f0; text-align: center; }
      img { width: 76px; height: 76px; border-radius: 19px; }
      h1 { margin: 20px 0 8px; font-family: "Fraunces", Georgia, serif; font-weight: 450; font-size: 38px; letter-spacing: -1px; }
      p { margin: 0 0 22px; color: #6f6256; line-height: 1.6; }
      button { min-height: 46px; border: 0; border-radius: 3px; padding: 0 20px; background: #9d3829; color: white; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="DeadlineOS" />
      <h1>You are offline</h1>
      <p>DeadlineOS does not store private dashboard data offline. Reconnect to view or update your tasks.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
