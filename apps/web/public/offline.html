<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#174d3d" />
    <title>DeadlineOS - Offline</title>
    <style>
      :root { color-scheme: light; font-family: Inter, system-ui, sans-serif; color: #213129; background: #f3f4ef; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { max-width: 420px; border: 1px solid #d8ddd4; border-radius: 24px; padding: 34px; background: white; box-shadow: 0 18px 55px rgba(31,48,40,.08); text-align: center; }
      img { width: 76px; height: 76px; border-radius: 19px; }
      h1 { margin: 20px 0 8px; font-size: 28px; letter-spacing: -1px; }
      p { margin: 0 0 22px; color: #69736d; line-height: 1.6; }
      button { min-height: 46px; border: 0; border-radius: 12px; padding: 0 20px; background: #174d3d; color: white; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="DeadlineOS" />
      <h1>You are offline</h1>
      <p>DeadlineOS does not store private dashboard data offline. Reconnect to view or update your tasks.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
