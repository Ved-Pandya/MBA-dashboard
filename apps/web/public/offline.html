<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#203d35" />
    <title>DeadlineOS - Offline</title>
    <style>
      @font-face { font-family: "IBM Plex Sans"; src: url("/fonts/ibm-plex-sans-latin-variable.woff2") format("woff2"); font-weight: 100 700; font-display: swap; }
      :root { color-scheme: light; font-family: "IBM Plex Sans", sans-serif; color: #203d35; background: #f4f7f2; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { max-width: 420px; border: 1px solid #c6db9f; border-radius: 16px; padding: 34px; background: #dcf694; text-align: center; }
      img { width: 76px; height: 76px; border-radius: 19px; }
      h1 { margin: 20px 0 8px; font-weight: 650; font-size: 34px; letter-spacing: -1px; }
      p { margin: 0 0 22px; color: #3c5635; line-height: 1.6; }
      button { min-height: 46px; border: 0; border-radius: 8px; padding: 0 20px; background: #203d35; color: white; font: inherit; font-weight: 600; cursor: pointer; }
      button:focus-visible { outline: 2px solid #203d35; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="DeadlineOS" />
      <h1>You are offline</h1>
      <p>DeadlineOS does not store private dashboard data offline. Reconnect to view or update your tasks.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
